version: '3.8'

services:
  db:
    image: postgres:15
    container_name: drivecar_db
    restart: always
    environment:
      POSTGRES_DB: drivecar_db
      POSTGRES_USER: raha
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: drivecar_web
    restart: always
    command: >
      sh -c "sleep 20 && 
             python manage.py migrate --noinput && 
             gunicorn core.wsgi:application --bind 0.0.0.0:9000 --workers 2 --timeout 120"
    ports:
      - "3000:9000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db

volumes:
  postgres_data:
